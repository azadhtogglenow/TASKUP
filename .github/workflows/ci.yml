name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: documents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Start MinIO Service
        run: |
          docker run -d \
            --name minio \
            --network ${{ job.container.network || 'bridge' }} \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            minio/minio:RELEASE.2024-01-18T22-51-28Z server /data

      - name: Wait for MinIO readiness & create bucket
        run: |
          echo "Waiting for MinIO to be ready..."
          docker exec minio mc ready local
          
          echo "Creating default application storage bucket..."
          docker exec minio mc alias set myminio http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb myminio/documents --ignore-existing

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Set Environment Variables for Pipeline Tasks
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/documents" >> $GITHUB_ENV
          echo "NODE_ENV=test" >> $GITHUB_ENV
          echo "POSTGRES_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_HOST=localhost" >> $GITHUB_ENV
          echo "REDIS_URL=redis://localhost:6379" >> $GITHUB_ENV
          echo "S3_ENDPOINT=http://localhost:9000" >> $GITHUB_ENV
          echo "S3_ACCESS_KEY=minioadmin" >> $GITHUB_ENV
          echo "S3_SECRET_KEY=minioadmin" >> $GITHUB_ENV
          echo "API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> $GITHUB_ENV
          echo "X_API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> $GITHUB_ENV
          echo "APP_API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> $GITHUB_ENV

      - name: Initialize Database Extensions
        run: |
          docker exec -i $(docker ps -qf "ancestor=pgvector/pgvector:pg17") psql -U postgres -d documents -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Run database migrations
        run: npm run db:push

      - name: Execute all tests
        run: npm run test:all
