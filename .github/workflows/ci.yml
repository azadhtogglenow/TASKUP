name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: documents
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Start MinIO Service
        run: |
          docker run -d \
            --name minio \
            --network ${{ job.container.network || 'bridge' }} \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            minio/minio:RELEASE.2024-01-18T22-51-28Z server /data

      - name: Wait for MinIO readiness & create bucket
        run: |
          echo "Waiting for MinIO to be ready..."
          docker exec minio mc ready local
          
          echo "Creating default application storage bucket..."
          docker exec minio mc alias set myminio http://localhost:9000 minioadmin minioadmin
          docker exec minio mc mb myminio/documents --ignore-existing

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # FIX 1: Generate absolute environment configs across all standard files to override ghost loaders
      - name: Set Environment Variables for Pipeline Tasks
        run: |
          # Create a master layout block
          echo "DATABASE_URL=postgresql://postgres:postgres@127.0.0.1:5432/documents" > .env.test
          echo "NODE_ENV=test" >> .env.test
          echo "POSTGRES_HOST=127.0.0.1" >> .env.test
          echo "POSTGRES_PORT=5432" >> .env.test
          echo "POSTGRES_USER=postgres" >> .env.test
          echo "POSTGRES_PASSWORD=postgres" >> .env.test
          echo "POSTGRES_DB=documents" >> .env.test
          echo "REDIS_HOST=127.0.0.1" >> .env.test
          echo "REDIS_URL=redis://127.0.0.1:6379" >> .env.test
          echo "S3_ENDPOINT=http://127.0.0.1:9000" >> .env.test
          echo "S3_PORT=9000" >> .env.test
          echo "S3_ACCESS_KEY=minioadmin" >> .env.test
          echo "S3_SECRET_KEY=minioadmin" >> .env.test
          echo "S3_BUCKET=documents" >> .env.test
          echo "API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> .env.test
          echo "X_API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> .env.test
          echo "APP_API_KEY=4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d" >> .env.test

          # Duplicate into a baseline .env file to satisfy the background agent tools
          cp .env.test .env

          # Export into global system environment shell variables
          cat .env.test >> $GITHUB_ENV

      # FIX 2: Let your program script handle extensions and apply Drizzle SQL snapshots natively
      - name: Run database migrations
        run: npm run db:migrate

      - name: Execute all tests
        run: npm run test:all
