name: CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]

jobs:
  test:
    name: Run Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: documents_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      # Start MinIO cleanly as a standard step to avoid option parsing bugs
      - name: Start MinIO Service
        run: |
          docker run -d \
            --name minio \
            --network ${{ job.container.network || 'bridge' }} \
            -p 9000:9000 \
            -p 9001:9001 \
            -e "MINIO_ROOT_USER=minioadmin" \
            -e "MINIO_ROOT_PASSWORD=minioadmin" \
            minio/minio:RELEASE.2024-01-18T22-51-28Z server /data

      # Wait explicitly until MinIO is healthy and ready to accept traffic
      - name: Wait for MinIO readiness
        run: |
          echo "Waiting for MinIO to be ready..."
          docker exec minio mc ready local

      - name: Set up Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run database migrations
        run: npm run db:push
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documents_test

      - name: Execute all tests
        run: npm run test:all
        env:
          NODE_ENV: test
          POSTGRES_HOST: localhost
          REDIS_HOST: localhost
          S3_ENDPOINT: http://localhost:9000
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/documents_test
          REDIS_URL: redis://localhost:6379
          API_KEY: 4a2b8c9d1e0f3a5b7c8d9e0f1a2b3c4d
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
